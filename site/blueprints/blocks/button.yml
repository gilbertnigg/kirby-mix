name: Button
icon: circle-nested
wysiwyg: true
preview: fields
fields:
  text:
    label: Text
    type: text
    required: true
    width: 1/3
  pagelink:
    label: Verlinkung Seite
    type: pages
    min: 1
    max: 1
    multiple: false
    width: 1/3
    image:
      back: black
    when:
      target: "internal"
  weblink:
    label: Verlinkung URL
    type: url
    required: true
    width: 1/3
    when:
      target: "external"
  target:
    label: Ziel
    type: toggles
    width: 1/3
    default: "internal"
    reset: false
    options:
      - value: internal
        text: interner Link
        icon: sitemap
      - value: external
        text: externer Link
        icon: open
